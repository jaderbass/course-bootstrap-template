<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilder gestalten</title>
  <!-- CSS only -->
  <!-- Bootstrap-CSS -->
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <script src="js/kurs-navigation.js" defer></script>
</head>

<body>
  <div class="container">
    <h1>Bilder gestalten</h1>
    <h2>mobil optimierte Bilder</h2>

    <div class="row">
      <div class="col-2">
        <img src="images/wand.jpg" alt="Eine Mauer">
      </div>
      <div class="col-4">
        <img src="images/wand.jpg" alt="Eine Mauer">
      </div>
      <div class="col-6">
        <img src="images/wand.jpg" alt="Eine Mauer">
      </div>
    </div>

    <h2>Bildoptionen</h2>

    <div class="row mb-5">

      <div class="col">
        <img class="img-fluid" src="images/wand.jpg" alt="Eine Mauer">
      </div>

      <div class="col">
        <img class="img-fluid" src="images/wand.jpg" alt="Eine Mauer">
      </div>

      <div class="col">
        <img class="img-fluid" src="images/wand.jpg" alt="Eine Mauer">
      </div>

      <div class="col">
        <img class="img-fluid" src="images/wand.jpg" alt="Eine Mauer">
      </div>

    </div>

    <h2>Bildunterschriften</h2>

    <div class="row">
      <div class="col">

        <!-- figure.figure>img.img-fluid+figcaption.figure-caption -->
        <figure>
          <img src="images/wand.jpg" alt="Eine Mauer" class="img-fluid">
          <figcaption>Eine Mauer</figcaption>
        </figure>

      </div>

      <div class="col">

        <!-- figure.figure>img.img-fluid+figcaption.figure-caption -->
        <figure>
          <img src="images/wand.jpg" alt="Eine Mauer" class="img-fluid">
          <figcaption>Eine Mauer</figcaption>
        </figure>

      </div>

      <div class="col">

        <!-- figure.figure>img.img-fluid+figcaption.figure-caption -->
        <figure class="figure">
          <img src="images/wand.jpg" alt="Eine Mauer" class="img-fluid">
          <figcaption>Eine Mauer</figcaption>
        </figure>

      </div>
    </div>

  </div>
</body>

</html>
