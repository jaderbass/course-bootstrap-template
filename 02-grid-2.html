<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Das Bootstrap-Grid Teil 2</title>
  <!-- CSS only -->
  <!-- Bootstrap-CSS -->
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom-CSS -->
  <link rel="stylesheet" href="css/grid2.css">
  <script src="js/kurs-navigation.js" defer></script>
</head>

<body>
  <div id="vertikal">

    <div class="container">
      <h1>Ausrichtung</h1>

      <h2>vertikal oben</h2>
      <div class="row"><!-- Standard -->
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
      </div>

      <h2>vertikal zentriert</h2>
      <div class="row">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
      </div>

      <h2>vertikal unten</h2>
      <div class="row">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
      </div>

      <h2>vertikal einzeln</h2>
      <div class="row">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
      </div>

    </div>

  </div>


  <div id="horizontal">
    <div class="container">

      <h2>horizontal links</h2>
      <div class="row"><!-- Standard -->
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
      </div>

      <h2>horizontal zentriert</h2>
      <div class="row">
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
      </div>

      <h2>horizontal rechts</h2>
      <div class="row">
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
      </div>

      <h2>horizontal verteilt mit gleichem Abstand links und rechts</h2>
      <div class="row">
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
      </div>

      <h2>horizontal verteilt mit gleichem Abstand dazwischen</h2>
      <div class="row">
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
      </div>

      <h2>horizontal verteilt mit gleichen Abständen</h2>
      <div class="row">
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
        <div class="col-2"></div>
      </div>

    </div>
  </div>
</body>

</html>
